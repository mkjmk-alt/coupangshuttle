name: Apply manual editor changes

on:
  push:
    branches:
      - main
    paths:
      - "manual_queue/**"

permissions:
  contents: write

concurrency:
  group: manual-editor-save
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Include any newer queued changes
        run: git pull --rebase origin main

      - name: Apply queued manual changes
        run: python3 scripts/apply_manual_queue.py

      - name: Commit merged data
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/shuttle_data.json
          git add public/data/shuttle_manual.json
          git add public/data/shuttle_meta.json
          git add public/data/shuttle_changelog.json
          git add -A manual_queue
          git commit -m "📝 Apply queued manual editor changes"
          git pull --rebase origin main
          git push origin HEAD:main
